services:
  - type: web
    name: lategenues-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=lategenues-client && npm run build --workspace=lategenues-server
    startCommand: npm run start --workspace=lategenues-server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
